[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mimic-eye-reporting"
version = "0.1.0"
description = "MIMIC-Eye disease classification and report generation"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "Pillow>=10,<13",
    "python-dotenv>=1,<2",
    "requests>=2.31,<3",
    "safetensors>=0.4,<1",
    "scikit-learn>=1.3,<2",
    "scipy>=1.11,<2",
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "transformers>=4.46,<5.4",
]

[project.optional-dependencies]
detector = ["ultralytics>=8.3,<8.4"]
biovil = ["hi-ml-multimodal>=0.2,<1"]
evaluation = [
    "bert-score>=0.3.13,<0.4",
    "nltk>=3.9,<4",
    "radgraph>=0.1.18,<0.2",
    "rouge-score>=0.1.2,<0.2",
]

[tool.setuptools]
packages = ["mimic_eye"]

[tool.setuptools.package-data]
mimic_eye = ["paper.json"]
